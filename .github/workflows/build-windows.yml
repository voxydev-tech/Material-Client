# Собирает установщики Windows на серверах GitHub: ничего ставить на свой компьютер не нужно.
# Запуск: вкладка Actions → Build Windows installer → Run workflow. Файлы появятся внизу страницы запуска (Artifacts).
name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installers and portable folder
        run: ./gradlew :composeApp:packageExe :composeApp:packageMsi :composeApp:createDistributable --no-daemon
      - name: Zip portable version
        shell: pwsh
        run: Compress-Archive -Path "composeApp/build/compose/binaries/main/app/Material Client" -DestinationPath MaterialClient-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MaterialClient-windows
          path: |
            composeApp/build/compose/binaries/main/exe/*.exe
            composeApp/build/compose/binaries/main/msi/*.msi
            MaterialClient-portable.zip
      # Для тега вида v0.3.0-beta создаёт страницу релиза со ссылкой на установщик: её и можно давать в канале.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            composeApp/build/compose/binaries/main/exe/*.exe
            composeApp/build/compose/binaries/main/msi/*.msi
            MaterialClient-portable.zip
